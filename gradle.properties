# Gradle / build settings.
# Kept deliberately low-memory so the project also builds on small machines.
# (This VM has <600 MB free RAM, so heaps are kept small and the Kotlin
# compiler runs in-process to avoid a second JVM.)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
