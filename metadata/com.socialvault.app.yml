AutoName: Social Accounts Vault
Summary: Keep your Facebook, Instagram and TikTok logins — plus websites and apps — in one colourful vault, on your device only.
Description: |-
  Social Accounts Vault keeps your social media accounts, websites and
  apps organised in one place — on your own device, and nowhere else.

  Bold, colourful cards for every email you use. Tap a card and a panel
  slides up: every Facebook, Instagram and TikTok ID on that email, each
  with its flag and country — plus any website (site name + URL) and any
  other app, all under the same email. Facebook Pages are listed under
  each Facebook ID (page name + followers). Passwords have show/hide and
  one-tap copy, and LOGIN buttons open each platform's login page in your
  browser; website entries open their site, app entries open the installed
  app (or a Play Store search when it is not installed).

  PIN lock with fingerprint unlock, a password generator and strength
  meter, live 2FA codes (TOTP), duplicate-password warnings, categories,
  notes and recovery details, backup/restore as a JSON file, and dark mode.

  Add, edit and delete entries (delete asks twice), filter by Social /
  Websites / Apps, and search by email, username, country, site, app,
  notes or category.

  Privacy first: everything is stored only in a local database on your
  phone. The app asks for no network permission at all — no internet
  access, no contacts, no storage — and sends nothing anywhere. It starts
  empty; you add your own accounts inside the app.

